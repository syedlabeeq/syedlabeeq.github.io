<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = '/'
        var path = window.location.pathname + window.location.search
        window.location.replace(
          window.location.origin + base + '?p=' + encodeURIComponent(path) + window.location.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
